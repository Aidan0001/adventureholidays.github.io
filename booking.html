<!doctype html>
<html lang="en">
    <head>
        <title>Home</title>
        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, shrink-to-fit=no"
            author="Aidan Keogh"
        />

        <!-- Bootstrap CSS v5.2.1 -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
            crossorigin="anonymous"
        />
        <link href="css/booking.css"
        rel="stylesheet"
        />
        <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
    </head>

    <body>
        <header>
            <nav
                class="navbar navbar-expand-md navbar-light"
                style="
                    background-color: rgba(73, 137, 233, 0.2)"
            >
                <button
                    class="navbar-toggler d-lg-none"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#collapsibleNavId"
                    aria-controls="collapsibleNavId"
                    aria-expanded="false"
                    aria-label="Toggle navigation"
                ></button>
                <div class="collapse navbar-collapse" id="collapsibleNavId">
                    <ul class="navbar-nav me-auto mt-2 mt-lg-0">
                        <li class="nav-item">
                            <a class="nav-link active" href="index.html" aria-current="page"
                            >Home</a>
                        <li class="nav-item">
                            <a class="nav-link active" href="activities.html" aria-current="page"
                                >Activities</a>
                            <li class="nav-item">
                                <a class="nav-link active" href="booking.html" aria-current="page"
                                    >Booking</a>
                    </ul>
                </div>
            </nav>
            
        </header>
        <main>
            <h3 class="title">Get in touch...</h3> 
            
              <form class="contact-form" novalidate> <!-- Starts form-->
                <div class="firstname"> <!--These are divs for the different form inputs-->
                  <label for="fname" class="fname">First name</label> <!--Label for form-->
                  <input type="text" class="fname-control" id="fname" placeholder="First name" required> <!--Declares input type, it's ID, what text is displayed when nothing is entered and if the field is required-->
                </div>
    
                <div class="lastname">
                  <label for="lname" class="lname">Last name</label>
                  <input type="text" class="lname-control" id="lname" placeholder="Last name" required>
                </div>
            
                <div class="country">
                  <div class="countrylist">
                    <label class="clabel">Country</label>
                    <select id="clist" name="countries">
                      <option value="Please select a country">Please select a country...</option>
                      <option value="France">France</option>
                      <option value="Switzerland">Switzerland</option>
                      </select>
                  </div>
                  <div class="dateselector">
                    <label for="datestart" class="date">Start Date</label>
                    <input type="date" class="date-control" id="datestart" required>
                    <br><label for="dateend" class="date">End Date</label>
                    <input type="date" class="date-control" id="dateend" required>
                  </div>

                  <div class="additional">
                    <label for="additional" class="number">Additional People</label>
                    <input type="number" class="number-control" id="additional" required>
                  </div>
                  <p>Group Discount (4+): 10% off automatically applied. You'll be emailed by our staff to help you plan the holiday from flight to hotel once we've confirmed the booking.</p>
                </div>      
                <div class="Submit">
                  <button class="sbtbutton" type="submit">Confirm Booking</button>
                </div>
              </form>
        </main>
        <footer>
            <div class="container p-4">
              </div>
              <div class="text-center p-3" style="background-color: rgba(73, 137, 233, 0.2);">
                <a href="about.html">|| © Adventure Holidays 2022 ||</a>
              </div>
        </footer>
        <!-- Bootstrap JavaScript Libraries -->
        <script
            src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
            integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
            crossorigin="anonymous"
        ></script>

        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"
            integrity="sha384-BBtl+eGJRgqQAUMxJ7pMwbEyER4l1g+O15P+16Ep7Q9Q+zqX6gSbd85u4mG4QzX+"
            crossorigin="anonymous"
        ></script>
    </body>
</html>
